<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Little Chef: Pizza Maker!</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      font-family: 'Fredoka', cursive, sans-serif;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: radial-gradient(circle, #FFF5E6 0%, #FED7AA 100%);
    }
    .step-btn-active {
      transform: scale(1.05);
      border-color: #F97316 !important;
      box-shadow: 0 10px 15px -3px rgba(249, 115, 22, 0.4);
    }
    .topping-btn {
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .topping-btn:active {
      transform: scale(0.9);
    }
    #pizzaCanvas {
      display: block;
      width: clamp(260px, 40vw, 520px);
      height: clamp(260px, 40vw, 520px);
      max-width: 520px;
      max-height: 520px;
      border-radius: 1.5rem;
      box-shadow: 0 20px 30px rgba(0, 0, 0, 0.08);
    }
    .pizza-shell {
      background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 100%);
      border: 4px solid #60a5fa;
      border-radius: 2rem;
      padding: 1rem;
      box-shadow: inset 0 0 0 4px rgba(255,255,255,0.3), 0 18px 25px rgba(96, 165, 250, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    main {
      width: 100%;
      max-width: 1180px;
      flex-wrap: nowrap;
      gap: clamp(0.75rem, 1.2vw, 1.5rem);
      align-items: center;
    }
    aside {
      width: clamp(260px, 20vw, 300px);
      height: clamp(360px, 52vw, 520px);
      min-height: 320px;
      background: linear-gradient(180deg, rgba(191, 219, 254, 0.95), rgba(147, 197, 253, 0.9));
      border: 4px solid #60a5fa;
      border-radius: 2rem;
      box-shadow: 0 18px 25px rgba(96, 165, 250, 0.18);
      padding: 0.9rem;
    }
    #controls-panel {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      align-items: stretch;
      justify-content: center;
      overflow-y: auto;
      width: 100%;
      height: 100%;
      padding: 0.2rem;
    }
    #controls-panel.selection-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.5rem;
      align-items: stretch;
      justify-items: stretch;
      overflow-y: auto;
      padding-bottom: 0.25rem;
    }
    #controls-panel.selection-grid > * {
      width: 100%;
      min-width: 0;
    }
    #controls-panel.selection-grid .topping-btn {
      padding-left: 0.4rem;
      padding-right: 0.4rem;
      font-size: 0.7rem;
      line-height: 1.1;
      white-space: normal;
    }
    #instruction-badge {
      z-index: 20;
    }
    @media (max-width: 1024px) {
      main {
        flex-direction: column;
        flex-wrap: wrap;
      }
      .pizza-shell {
        margin-bottom: 0.5rem;
        margin-left: 0;
      }
      aside {
        width: min(90vw, 420px);
        height: auto;
        min-height: 220px;
      }
      #pizzaCanvas {
        width: min(76vw, 420px);
        height: min(76vw, 420px);
      }
    }
    @media (min-width: 1025px) {
      body {
        overflow-x: hidden;
      }
      .pizza-shell {
        margin-left: -0.9rem;
      }
    }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col justify-between items-center p-2 md:p-4 select-none">

  <!-- Header Banner -->
  <header class="w-full max-w-6xl flex items-center justify-between bg-white/80 backdrop-blur-md rounded-2xl p-3 shadow-lg border-2 border-orange-200 z-10">
    <div class="flex items-center gap-2">
      <span class="text-3xl md:text-4xl">🍕</span>
      <h1 class="text-xl md:text-3xl font-bold text-orange-600 tracking-wide">Welcome to Dee's Pizza shop!</h1>
    </div>

    <div id="stage-indicator" class="flex gap-1 md:gap-2">
      <!-- Generated dynamically by JS -->
    </div>

    <button id="reset-btn" class="bg-red-500 hover:bg-red-600 active:scale-95 text-white text-sm md:text-base font-bold py-2 px-3 md:px-4 rounded-xl shadow-md transition-all flex items-center gap-1">
      🔄 <span>New</span>
    </button>
  </header>

  <main class="relative w-full max-w-6xl flex-1 my-2 flex items-center justify-center gap-4 min-h-0">
    <div class="pizza-shell">
      <canvas id="pizzaCanvas" class="bg-transparent rounded-3xl cursor-pointer touch-none"></canvas>
    </div>

    <aside class="w-[280px] h-[520px] rounded-3xl border-4 border-blue-400 bg-blue-200/80 shadow-lg p-3 flex-shrink-0">
      <div id="controls-panel" class="w-full h-full">
        <!-- Dynamic Controls based on game stage are rendered here -->
      </div>
    </aside>

    <div id="instruction-badge" class="absolute top-4 left-1/2 -translate-x-1/2 bg-white/90 backdrop-blur-sm border-2 border-orange-400 px-6 py-2 rounded-full shadow-lg text-orange-700 text-lg md:text-2xl font-bold animate-bounce pointer-events-none">
      Tap to Roll Dough! 🪵
    </div>

    <div id="oven-overlay" class="hidden absolute inset-0 bg-black/40 backdrop-blur-xs rounded-3xl flex flex-col items-center justify-center p-6 text-white text-center">
      <div class="text-6xl md:text-8xl mb-4 animate-pulse">🔥</div>
      <h2 class="text-2xl md:text-4xl font-bold mb-4 text-yellow-300">Baking Your Pizza!</h2>
      <div class="w-full max-w-md bg-gray-700 rounded-full h-6 border-2 border-white overflow-hidden shadow-inner">
        <div id="bake-progress" class="bg-gradient-to-r from-yellow-400 to-red-500 h-full w-0 transition-all duration-100 rounded-full"></div>
      </div>
    </div>
  </main>
  <script src="game.js"></script>
</body>
</html>
