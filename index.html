<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Little Chef's Pizza Maker</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    html, body { 
      margin: 0; 
      padding: 0;
      width: 100vw;
      height: 100dvh;
      background: #2c3e50; 
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      touch-action: none;
      font-family: Arial, sans-serif;
    }
    canvas { 
      background: #87CEEB; 
      display: block; 
      max-width: 95vw; 
      max-height: 85dvh; 
      object-fit: contain;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      touch-action: none;
    }
  </style>
</head>
<body>

  <canvas id="gameCanvas" width="400" height="600"></canvas>
  <script src="game.js"></script>

</body>
</html>
