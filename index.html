<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Little Chef: Pizza Maker!</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      font-family: 'Fredoka', cursive, sans-serif;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    body { 
      margin: 0; 
      padding: 0;
      background: #2c3e50; 
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: manipulation;
      font-family: Arial, sans-serif;
    }
    canvas { 
      background: #87CEEB; 
      display: block; 
      margin: auto; 
      max-width: 100vw; 
      max-height: 100vh;
      object-fit: contain;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col justify-between items-center p-2 md:p-4 select-none">

  <!-- Header Banner -->
  <header class="w-full max-w-4xl flex items-center justify-between bg-white/80 backdrop-blur-md rounded-2xl p-3 shadow-lg border-2 border-orange-200 z-10">
    <div class="flex items-center gap-2">
      <span class="text-3xl md:text-4xl">🍕</span>
      <h1 class="text-xl md:text-3xl font-bold text-orange-600 tracking-wide">Little Chef Pizza!</h1>
    </div>
    
    <!-- Stage Navigation / Progress -->
    <div id="stage-indicator" class="flex gap-1 md:gap-2">
      <!-- Generated dynamically by JS -->
    </div>

    <!-- Restart Button -->
    <button id="reset-btn" class="bg-red-500 hover:bg-red-600 active:scale-95 text-white text-sm md:text-base font-bold py-2 px-3 md:px-4 rounded-xl shadow-md transition-all flex items-center gap-1">
      🔄 <span>New</span>
    </button>
  </header>

  <!-- Main Game Canvas Container -->
  <main class="relative w-full max-w-2xl flex-1 my-2 flex items-center justify-center min-h-0">
    <canvas id="pizzaCanvas" class="bg-transparent rounded-3xl cursor-pointer max-w-full max-h-full touch-none"></canvas>

    <!-- Overlay Prompt / Instruction Badge -->
    <div id="instruction-badge" class="absolute top-4 bg-white/90 backdrop-blur-sm border-2 border-orange-400 px-6 py-2 rounded-full shadow-lg text-orange-700 text-lg md:text-2xl font-bold animate-bounce pointer-events-none">
      Tap to Roll Dough! 🪵
    </div>

    <!-- Oven Controls Overlay (Hidden by default) -->
    <div id="oven-overlay" class="hidden absolute inset-0 bg-black/40 backdrop-blur-xs rounded-3xl flex flex-col items-center justify-center p-6 text-white text-center">
      <div class="text-6xl md:text-8xl mb-4 animate-pulse">🔥</div>
      <h2 class="text-2xl md:text-4xl font-bold mb-4 text-yellow-300">Baking Your Pizza!</h2>
      <div class="w-full max-w-md bg-gray-700 rounded-full h-6 border-2 border-white overflow-hidden shadow-inner">
        <div id="bake-progress" class="bg-gradient-to-r from-yellow-400 to-red-500 h-full w-0 transition-all duration-100 rounded-full"></div>
      </div>
    </div>
  </main>

  <!-- Action Controls / Tool Palette Container -->
  <footer class="w-full max-w-4xl bg-white/90 backdrop-blur-md rounded-2xl p-3 shadow-lg border-2 border-orange-200 z-10 min-h-[110px] flex items-center justify-center">
    <div id="controls-panel" class="w-full flex items-center justify-center gap-2 md:gap-4 overflow-x-auto py-1">
      <!-- Dynamic Controls based on game stage are rendered here -->
    </div>
  </footer>

  <!-- Sound Effects / Audio synth loader -->
  <script src="game.js"></script>
</body>
</html>
